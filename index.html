<!DOCTYPE html>
<html lang="ko" data-theme="B">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF1EC">
  <meta name="robots" content="noindex">
  <title>건강일기 · 대사 코치</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="건강일기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var t = localStorage.getItem('mc_theme'); if (t === 'A' || t === 'B') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" hidden>
      <a href="#/record" data-tab="record"></a>
      <a href="#/calendar" data-tab="calendar"></a>
      <a href="#/journey" data-tab="journey"></a>
      <a href="#/coach" data-tab="coach"></a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
