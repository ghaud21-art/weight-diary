<!DOCTYPE html>
<html lang="ko" data-theme="B">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF1EC">
  <meta name="robots" content="noindex">
  <title>건강일기 · 대사 코치</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E39898' stroke-width='2'%3E%3Cpath d='M12 21c4.5-3 7-6.2 7-9.5A5.5 5.5 0 0 0 12 6a5.5 5.5 0 0 0-7 5.5C5 14.8 7.5 18 12 21Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var t = localStorage.getItem('mc_theme'); if (t === 'A' || t === 'B') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" hidden>
      <a href="#/record" data-tab="record"></a>
      <a href="#/calendar" data-tab="calendar"></a>
      <a href="#/journey" data-tab="journey"></a>
      <a href="#/coach" data-tab="coach"></a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
